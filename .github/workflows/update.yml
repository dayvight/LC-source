name: Update source

# Rebuilds all-apps.json from the GitHub releases of every app listed in apps.txt.
# Runs every 6 hours and on demand. No secrets are needed — it uses the token
# GitHub injects into every workflow run.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps.txt'
      - 'apps/**/meta.json'
      - 'apps/**/icon.png'
      - 'scripts/build_source.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pillow

      - name: Build sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_source.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh sources"
            git push
          fi
